[package]
name = "ui"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "Rust 框架与生态系统 UI - 2025年完整指南"
authors = ["Rust Framework Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/ui"
keywords = ["rust", "ui", "web", "async", "ecosystem"]
categories = ["web-programming", "asynchronous"]
rust-version = "1.90"

[dependencies]
# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# 工作区内网络模块
hyper = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
hyper-util = { workspace = true }
http-body-util = "0.1.3"
bytes = { workspace = true }

# 异步运行时
tokio = { workspace = true }
# async-std 已移除，使用 tokio 替代 (async-std 已弃用)

# 2025年最新前端框架 - 跨平台UI (Rust 1.90优化版)
# Dioxus: React-like跨平台UI框架，支持Web、Desktop、Mobile
# 特性: 声明式组件、虚拟DOM、热重载、类型安全
# 性能: 高性能渲染、内存安全、零运行时开销
dioxus = { workspace = true, optional = true }
dioxus-web = { workspace = true, optional = true }
# dioxus-desktop = { workspace = true, optional = true }  # 暂时禁用，存在版本冲突

# Leptos: 现代Web框架，零运行时开销
# 特性: 细粒度响应式、SSR支持、编译时优化
# 性能: 接近原生JavaScript性能、极小包大小
leptos = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }

# 2025年最新原生GUI框架 - Slint 1.5 (Rust 1.90优化)
# Slint: 原生性能GUI框架，专为嵌入式设备设计
# 特性: 声明式UI、原生渲染、低内存占用、跨平台支持
# 性能: 原生性能、极小内存占用、快速启动
slint = { workspace = true, optional = true }

# 2025年最新桌面应用框架 - Tauri 2.0 (完全跨平台)
# Tauri: 轻量级桌面应用框架，比Electron小10倍以上
# 特性: 系统集成、安全性、跨平台、原生性能
# 性能: 轻量级、高安全性、原生系统API访问
tauri = { workspace = true, optional = true }
tauri-build = { workspace = true, optional = true }

# 2025年现代化GUI框架 - Iced 0.12 (Rust 1.90优化)
# Iced: Elm启发的声明式GUI框架
# 特性: 函数式编程、数据驱动、类型安全、跨平台
# 性能: 清晰架构、易于维护、现代化设计
iced = { workspace = true, optional = true }

# 2025年即时模式GUI - egui 0.27 (Rust 1.90优化)
# egui: 即时模式GUI框架，适合工具和调试界面
# 特性: 简单API、即时模式、跨平台、快速开发
# 性能: 快速原型、易于集成、中等性能开销
egui = { workspace = true, optional = true }
eframe = { version = "0.32.3", optional = true }

# 2025年最新高性能异步运行时 - 暂时禁用，Windows构建问题
# glommio = { workspace = true, optional = true }

# Web框架
actix-web = { version = "4.11.0", optional = true }
axum = { workspace = true, optional = true }
rocket = { version = "0.5.1", optional = true }
warp = { version = "0.4.2", optional = true }

# 数据库与ORM - 使用工作区最新版本
diesel = { version = "2.3.2", features = ["postgres"], optional = true }
sea-orm = { workspace = true, optional = true, features = ["sqlx-postgres", "runtime-tokio-rustls"], default-features = false }
# sqlx 直接依赖移除以规避 sqlite 冲突
dotenvy = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 企业级应用依赖
uuid = { workspace = true }
reqwest = { workspace = true, optional = true }
async-trait = "0.1"
env_logger = { version = "0.11", optional = true }
rand = { workspace = true }
chrono = { workspace = true }
bincode = { workspace = true }
rmp-serde = { version = "1.3.0", optional = true }

# 命令行工具
clap = { version = "4.5.48", features = ["derive"], optional = true }
# structopt 已移除，使用 clap 4.x 替代 (解决 ansi_term 和 atty 安全漏洞)

# 移除重复的GUI框架定义，已在上面定义

# 测试框架 - 使用工作区统一版本
criterion = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }

# 日志 - 使用工作区统一版本
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# 其他工具

# 安全相关
jsonwebtoken = { version = "9.3.1", optional = true }
argon2 = { version = "0.5.3", optional = true }
base64 = { version = "0.22.1", optional = true }
hmac = { version = "0.12.1", optional = true }
sha2 = { version = "0.10.9", optional = true }
aes-gcm = { version = "0.10.3", optional = true }

# 性能优化 - 使用工作区统一版本
memmap2 = { version = "0.9.8", optional = true }
rayon = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
lru = { version = "0.12.5", optional = true }
crossbeam = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

# 监控和可观测性
opentelemetry = { version = "0.21.0", optional = true }
opentelemetry_sdk = { version = "0.21.2", optional = true }
opentelemetry-stdout = { version = "0.30.0", optional = true }
prometheus = { version = "0.13.4", optional = true }

# 异步和并发 - 使用工作区统一版本
futures = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# 配置管理
toml = { workspace = true, optional = true }

[features]
default = ["web", "database", "serialization", "cli", "config"]
web = ["actix-web", "axum", "warp"]
# 将默认 database 设为仅 diesel，避免 sqlx 冲突
database = ["diesel"]
# database-sqlx 特性保留占位（暂无直依赖）
database-sqlx = []
serialization = ["rmp-serde"]
cli = ["clap"]
gui = ["egui", "iced"]
testing = ["criterion", "mockall", "proptest"]
http-client = ["reqwest"]
logging = ["tracing", "tracing-subscriber", "env_logger"]
config = ["toml"]
security = ["jsonwebtoken", "argon2", "base64", "hmac", "sha2", "aes-gcm"]
performance = ["memmap2", "rayon", "dashmap", "lru", "crossbeam", "parking_lot"]
monitoring = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-stdout", "prometheus"]
async-patterns = ["futures", "tokio-util"]
tokio = []
serde = []
uuid = []
chrono = []

# 2025年最新框架特性 (Rust 1.90优化版)
dioxus = ["dep:dioxus", "dep:dioxus-web"]
# dioxus-full = ["dep:dioxus", "dep:dioxus-web", "dep:dioxus-desktop"]  # 暂时禁用，存在版本冲突
leptos = ["dep:leptos", "dep:leptos_axum"]
tauri = ["dep:tauri", "dep:tauri-build"]
slint = ["dep:slint"]
iced = ["dep:iced"]
egui = ["dep:egui", "dep:eframe"]

# 组合特性 - 基于Rust 1.90优化
modern-ui = ["dioxus", "leptos"]  # 现代Web UI框架
desktop-apps = ["egui", "iced", "tauri", "slint"]  # 桌面应用框架组合
native-gui = ["slint", "egui", "iced"]  # 原生GUI框架组合
cross-platform = ["dioxus", "tauri", "slint"]  # 跨平台UI框架
web-focused = ["dioxus", "leptos"]  # Web优先框架
mobile-ready = ["tauri", "dioxus"]  # 移动端支持框架
high-performance = ["slint", "egui", "performance"]  # 高性能框架组合

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "c11_frameworks"
path = "src/lib.rs"

[[bin]]
name = "c11_frameworks"
path = "src/bin/main.rs"

[[example]]
name = "actix_web_example"
path = "examples/actix_web_example.rs"
required-features = ["actix-web"]

[[example]]
name = "axum_example"
path = "examples/axum_example.rs"
